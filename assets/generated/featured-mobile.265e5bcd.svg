</style><text x="2" y="22" class="section">featured work</text><line class="line" x1="2" y1="35.0" x2="418.0" y2="35.0"/><g transform="translate(0,44)"><text x="8.0" y="34.5" class="title"><tspan x="8.0" dy="0">Predictive Maintenance at Scale</tspan></text><text x="8.0" y="56.5" class="category"><tspan x="8.0" dy="0">MACHINE LEARNING · VALE DESENVOLVER</tspan></text><text x="8.0" y="80.5" class="desc"><tspan x="8.0" dy="0">37M telemetry records from an iron ore mine. 4.9x the operational</tspan><tspan x="8.0" dy="15">heuristic, with the failure modes published.</tspan></text></g><line class="soft-line" x1="0" y1="149.3" x2="420.0" y2="149.3"/><g transform="translate(0,155)"><text x="8.0" y="34.5" class="title"><tspan x="8.0" dy="0">LLM Agents in a Regulated Bank</tspan></text><text x="8.0" y="56.5" class="category"><tspan x="8.0" dy="0">PRODUCTION AI · BANCO INTER</tspan></text><text x="8.0" y="80.5" class="desc"><tspan x="8.0" dy="0">Nine automations in seven months, removing 1.4 full-time roles of</tspan><tspan x="8.0" dy="15">manual work under audit constraints.</tspan></text></g><line class="soft-line" x1="0" y1="260.7" x2="420.0" y2="260.7"/><g transform="translate(0,267)"><text x="8.0" y="34.5" class="title"><tspan x="8.0" dy="0">Data Quality at 37 Million Rows</tspan></text><text x="8.0" y="56.5" class="category"><tspan x="8.0" dy="0">WRITING · DATA ENGINEERING</tspan></text><text x="8.0" y="80.5" class="desc"><tspan x="8.0" dy="0">Four silent failures. One touched 11 rows, another touched 36</tspan><tspan x="8.0" dy="15">million. Neither threw an exception.</tspan></text></g><line class="line" x1="0" y1="380.0" x2="420.0" y2="380.0"/></svg>