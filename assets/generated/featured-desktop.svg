</style><text x="2" y="22" class="section">featured work</text><line class="line" x1="2" y1="35.0" x2="878.0" y2="35.0"/><g transform="translate(0,34)"><text x="8.0" y="36.0" class="title"><tspan x="8.0" dy="0">Predictive Maintenance at Scale</tspan></text><text x="8.0" y="58.0" class="category"><tspan x="8.0" dy="0">MACHINE LEARNING · VALE DESENVOLVER</tspan></text><text x="8.0" y="82.0" class="desc"><tspan x="8.0" dy="0">37M telemetry records from an iron ore</tspan><tspan x="8.0" dy="17">mine. 4.9x the operational heuristic,</tspan><tspan x="8.0" dy="17">with the failure modes published.</tspan></text></g><g transform="translate(0,34)"><text x="313.3" y="36.0" class="title"><tspan x="313.3" dy="0">LLM Agents in a Regulated Bank</tspan></text><text x="313.3" y="58.0" class="category"><tspan x="313.3" dy="0">PRODUCTION AI · BANCO INTER</tspan></text><text x="313.3" y="82.0" class="desc"><tspan x="313.3" dy="0">Nine automations in seven months,</tspan><tspan x="313.3" dy="17">removing 1.4 full-time roles of manual</tspan><tspan x="313.3" dy="17">work under audit constraints.</tspan></text></g><line class="soft-line" x1="293.3" y1="54" x2="293.3" y2="172"/><g transform="translate(0,34)"><text x="606.7" y="36.0" class="title"><tspan x="606.7" dy="0">Data Quality at 37 Million Rows</tspan></text><text x="606.7" y="58.0" class="category"><tspan x="606.7" dy="0">WRITING · DATA ENGINEERING</tspan></text><text x="606.7" y="82.0" class="desc"><tspan x="606.7" dy="0">Four silent failures. One touched 11</tspan><tspan x="606.7" dy="17">rows, another touched 36 million.</tspan><tspan x="606.7" dy="17">Neither threw an exception.</tspan></text></g><line class="soft-line" x1="586.7" y1="54" x2="586.7" y2="172"/><line class="line" x1="0" y1="179.8" x2="880.0" y2="179.8"/></svg>