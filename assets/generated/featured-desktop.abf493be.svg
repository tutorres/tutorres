<svg xmlns="http://www.w3.org/2000/svg" width="880" height="187" viewBox="0 0 880 187"><style>@media(prefers-color-scheme:dark){.ink{fill:#e6edf3}.muted{fill:#8b949e}.lbl{fill:#7d8590}.ln{stroke:#30363d}.sln{stroke:#21262d}.cd{fill:#161b22;stroke:#30363d}.ar{stroke:#7d8590}}</style><text x="2.0" y="22.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#1f2328" class="ink" text-anchor="start">featured work</text><line x1="2.0" y1="35.0" x2="878.0" y2="35.0" stroke="#d0d7de" class="ln"/><text x="4.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">MACHINE LEARNING · VALE DESENVOLVER</text><text x="4.0" y="92.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">Predictive Maintenance at Scale</text><text x="4.0" y="116.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">37M telemetry records from an iron ore</text><text x="4.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">mine. 4.9x the operational heuristic,</text><text x="4.0" y="153.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">with the failure modes published.</text><text x="315.3" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">PRODUCTION AI · BANCO INTER</text><text x="315.3" y="92.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">LLM Agents in a Regulated Bank</text><text x="315.3" y="116.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">Nine automations in seven months,</text><text x="315.3" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">removing 1.4 full-time roles of manual</text><text x="315.3" y="153.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">work under audit constraints.</text><text x="608.7" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">WRITING · DATA ENGINEERING</text><text x="608.7" y="92.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">Data Quality at 37 Million Rows</text><text x="608.7" y="116.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">Four silent failures. One touched 11</text><text x="608.7" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">rows, another touched 36 million.</text><text x="608.7" y="153.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">Neither threw an exception.</text><line x1="293.3" y1="50.0" x2="293.3" y2="169.1" stroke="#eaeef2" class="sln"/><line x1="586.7" y1="50.0" x2="586.7" y2="169.1" stroke="#eaeef2" class="sln"/><line x1="0.0" y1="179.1" x2="880.0" y2="179.1" stroke="#d0d7de" class="ln"/></svg>