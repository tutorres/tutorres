<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="420" height="336" viewBox="0 0 420 336"><style>@media(prefers-color-scheme:dark){.ink{fill:#e6edf3}.muted{fill:#8b949e}.lbl{fill:#7d8590}.ln{stroke:#30363d}.sln{stroke:#21262d}.cd{fill:#161b22;stroke:#30363d}.ar{stroke:#7d8590}}</style><text x="2.0" y="22.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#1f2328" class="ink" text-anchor="start">featured work</text><line x1="2.0" y1="35.0" x2="418.0" y2="35.0" stroke="#d0d7de" class="ln"/><text x="6.0" y="66.0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">MACHINE LEARNING · VALE DESENVOLVER</text><text x="6.0" y="88.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">Predictive Maintenance at Scale</text><text x="6.0" y="111.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">37M telemetry records from an iron ore mine. 4.9x the operational</text><text x="6.0" y="127.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">heuristic, with the failure modes published.</text><line x1="0.0" y1="140.8" x2="420.0" y2="140.8" stroke="#eaeef2" class="sln"/><text x="6.0" y="155.8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">PRODUCTION AI · BANCO INTER</text><text x="6.0" y="178.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">LLM Agents in a Regulated Bank</text><text x="6.0" y="201.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">Nine automations in seven months, removing 1.4 full-time roles of</text><text x="6.0" y="217.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">manual work under audit constraints.</text><line x1="0.0" y1="230.7" x2="420.0" y2="230.7" stroke="#eaeef2" class="sln"/><text x="6.0" y="245.7" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9" font-weight="600" fill="#656d76" class="lbl" text-anchor="start" letter-spacing="1.1">WRITING · DATA ENGINEERING</text><text x="6.0" y="268.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" class="ink" text-anchor="start">Data Quality at 37 Million Rows</text><text x="6.0" y="290.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">Four silent failures. One touched 11 rows, another touched 36</text><text x="6.0" y="307.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#57606a" class="muted" text-anchor="start">million. Neither threw an exception.</text><line x1="0.0" y1="325.6" x2="420.0" y2="325.6" stroke="#d0d7de" class="ln"/></svg>